        font-size="22" fill="#8b5cf6" opacity="0.85" letter-spacing="4">✨  G É N É R É  P A R  I A</text>
  <text x="640" y="289" text-anchor="middle" dominant-baseline="middle"
               font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
               font-size="50" font-weight="700" fill="white" filter="url(#shadow)">Différence entre Scrum et</text>
    <text x="640" y="351" text-anchor="middle" dominant-baseline="middle"
